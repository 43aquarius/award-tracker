<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0D13">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>倒计时</title>
<style>
/* ==========================================================
 * 倒计时 v2 —— 深色高级感设计系统
 * 兼容目标：Chromium 55+（无 flex gap / clamp / backdrop-filter）
 * ========================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0B0D13;
  --bg-soft: #10131B;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --t1: #F4F6FA;
  --t2: #9AA3B4;
  --t3: #5D6577;
  --brand: #8B7CFF;
  --brand-soft: rgba(139, 124, 255, 0.16);
  --brand-line: rgba(139, 124, 255, 0.38);
  --teal: #5EEAD4;
  --amber: #FFC24B;
  --coral: #FF7A6B;
  --red: #FF5D5D;
  --radius: 16px;
  --dock-h: 60px;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--t1);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
/* 背景氛围光 */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(620px 420px at 88% -12%, rgba(139, 124, 255, 0.17), transparent 62%),
    radial-gradient(520px 400px at -12% 34%, rgba(94, 234, 212, 0.07), transparent 60%),
    radial-gradient(760px 540px at 50% 112%, rgba(139, 124, 255, 0.11), transparent 62%);
}
::selection { background: rgba(139, 124, 255, 0.35); }
::-webkit-scrollbar { width: 0; height: 0; }
a { color: #A99BFF; text-decoration: none; }
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; color: var(--t1); }

#app { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; min-height: 100vh; }
@media (min-width: 560px) {
  #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 12px;
  background: rgba(11, 13, 19, 0.88);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; margin-right: 10px;
  background: linear-gradient(135deg, #7C6BFF 0%, #9B8FFF 52%, #5EEAD4 135%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(124, 107, 255, 0.38);
}
.brand-mark svg { width: 17px; height: 17px; }
.brand-text { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
.urgent-chip {
  display: flex; align-items: center;
  background: rgba(255, 122, 107, 0.13); border: 1px solid rgba(255, 122, 107, 0.35);
  color: #FFB3A9; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600;
}
.urgent-chip .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--coral); margin-right: 6px;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.75); } }

/* ---------- 视图与页面结构 ---------- */
main { padding: 18px 16px calc(var(--dock-h) + 58px); }
.view { display: none; animation: fadeUp 0.32s ease both; }
.view.on { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.page-title { font-size: 21px; font-weight: 800; letter-spacing: 0.3px; }
.page-sub { font-size: 12px; color: var(--t3); margin-top: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.card.pad { padding: 15px 16px; }
.card + .card { margin-top: 12px; }
.card-list .card { margin-bottom: 12px; }

.field-label { font-size: 12px; font-weight: 600; color: var(--t2); letter-spacing: 0.6px; margin-bottom: 9px; }

/* ---------- 通用按钮 ---------- */
.btn-primary {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 13px 16px; border-radius: 13px;
  background: linear-gradient(135deg, #7C6BFF 0%, #9B8FFF 52%, #5EEAD4 135%);
  color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
  box-shadow: 0 8px 24px rgba(124, 107, 255, 0.32);
  transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}
.btn-primary:active { transform: scale(0.975); }
.btn-primary:disabled { opacity: 0.55; box-shadow: none; }
.btn-primary svg { margin-right: 8px; }
.btn-primary.loading { background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line-2); color: var(--t1);
  transition: background 0.15s ease, transform 0.12s ease;
}
.btn-ghost:active { transform: scale(0.96); background: var(--surface-2); }
.btn-danger-txt { color: #FF8A80; font-size: 13px; font-weight: 600; padding: 8px 0; display: inline-flex; align-items: center; }
.btn-danger-txt svg { margin-right: 5px; }
.mini-link { font-size: 12px; color: #A99BFF; padding: 6px 8px; }
.mini-link:active { opacity: 0.6; }

/* ---------- 紧急横幅 ---------- */
.urgent-banner {
  position: relative; border-radius: 14px; padding: 13px 15px; margin-bottom: 14px;
  background: linear-gradient(135deg, rgba(255, 122, 107, 0.13), rgba(255, 194, 75, 0.09));
  border: 1px solid rgba(255, 122, 107, 0.32);
  display: flex; align-items: center; justify-content: space-between;
}
.urgent-banner .ub-txt { font-size: 13px; color: #FFC9C2; }
.urgent-banner .ub-txt b { color: #FF9C90; font-weight: 700; }
.urgent-banner .ub-close { margin-left: 10px; color: rgba(255, 194, 194, 0.65); display: flex; }

/* ---------- 分段筛选 ---------- */
.seg {
  display: flex; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 3px; margin-bottom: 12px;
}
.seg button {
  flex: 1; padding: 7px 4px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
  color: var(--t2); transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.seg button.on { background: var(--surface-2); color: var(--t1); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg button .cnt { opacity: 0.6; font-weight: 500; margin-left: 2px; font-size: 11px; }

.searchbar {
  display: flex; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin-bottom: 14px;
  color: var(--t3);
}
.searchbar input {
  flex: 1; background: none; border: 0; outline: none; padding: 10px 8px; font-size: 13.5px;
}
.searchbar input::placeholder { color: var(--t3); }

/* ---------- 倒计时卡片 ---------- */
.rcard {
  position: relative; display: flex; align-items: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 14px 12px 12px;
  animation: fadeUp 0.34s ease both;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.rcard:active { background: var(--surface-2); }
.rcard.open { border-color: var(--brand-line); background: rgba(139, 124, 255, 0.055); }
.rcard.urg-coral { border-left: 3px solid rgba(255, 122, 107, 0.75); }
.rcard.urg-amber { border-left: 3px solid rgba(255, 194, 75, 0.7); }
.rcard.urg-violet { border-left: 3px solid rgba(139, 124, 255, 0.65); }
.rcard.urg-teal { border-left: 3px solid rgba(94, 234, 212, 0.55); }
.rcard.urg-red { border-left: 3px solid rgba(255, 93, 93, 0.8); }
.rcard.urg-none { border-left: 3px solid rgba(255, 255, 255, 0.14); }

.ring-box { position: relative; width: 64px; height: 64px; margin-right: 13px; flex-shrink: 0; }
.ring-box svg { transform: rotate(-90deg); }
.ring-bg { stroke: rgba(255, 255, 255, 0.08); }
.ring-fg { transition: stroke-dashoffset 0.9s cubic-bezier(0.25, 0.8, 0.3, 1); }
.ring-mid {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.ring-num { font-size: 19px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.ring-unit { font-size: 8.5px; color: var(--t3); margin-top: 2.5px; letter-spacing: 1px; }

.rcard-main { flex: 1; min-width: 0; }
.rcard-name {
  font-size: 14.5px; font-weight: 700; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.rcard-date { font-size: 12px; color: var(--t2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.rcard-date .dd-today { color: var(--coral); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; margin-top: 7px; margin-left: -4px; }
.chip {
  display: inline-flex; align-items: center;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.3px;
  border-radius: 999px; padding: 2.5px 8px; margin: 3px 4px 0 0;
  background: var(--surface-2); color: var(--t2); border: 1px solid transparent;
}
.chip.fit { background: rgba(94, 234, 212, 0.12); color: #7CF0DE; }
.chip.unsure { background: rgba(255, 194, 75, 0.13); color: #FFD37A; }
.chip.mismatch { background: rgba(255, 93, 93, 0.13); color: #FF9C93; }
.chip.brand { background: var(--brand-soft); color: #B4A7FF; }
.chip.link { color: #A99BFF; background: rgba(139, 124, 255, 0.1); }

.rcard-detail { display: none; margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.rcard.open .rcard-detail { display: block; }
.drow { display: flex; font-size: 12.5px; margin-bottom: 6px; line-height: 1.5; }
.drow .k { width: 56px; flex-shrink: 0; color: var(--t3); }
.drow .v { flex: 1; color: var(--t1); word-break: break-all; }
.drow .v a { word-break: break-all; }
.rcard-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.added-at { font-size: 11px; color: var(--t3); }

/* ---------- 空状态 ---------- */
.empty { text-align: center; padding: 96px 20px 30px; color: var(--t3); }
.empty > svg { width: 62px; height: 62px; opacity: 0.34; margin-bottom: 16px; }
.empty-title { font-size: 15px; font-weight: 700; color: var(--t2); margin-bottom: 5px; }
.empty-sub { font-size: 12.5px; line-height: 1.7; }
.empty .btn-primary { width: auto; padding: 11px 26px; margin: 20px auto 0; }

/* ---------- 解析页 ---------- */
.card .textarea-wrap { position: relative; }
textarea#noticeText {
  width: 100%; min-height: 168px; resize: vertical; outline: none;
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 13px; font-size: 13.5px; line-height: 1.6;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
textarea#noticeText:focus { border-color: var(--brand-line); box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.13); }
textarea#noticeText::placeholder { color: var(--t3); }
.ta-meta { text-align: right; font-size: 11px; color: var(--t3); margin-top: 6px; }

.engine-pills { display: flex; margin-left: -5px; }
.engine-pill {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 11px 6px; margin: 0 5px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--t2); transition: all 0.18s ease;
}
.engine-pill .ep-name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; }
.engine-pill .ep-name svg { margin-right: 5px; }
.engine-pill .ep-sub { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
.engine-pill.on {
  background: rgba(139, 124, 255, 0.1); border-color: var(--brand-line); color: var(--t1);
  box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.08);
}
.engine-pill.on .ep-sub { color: #B4A7FF; }
.mt { margin-top: 12px; }

.parse-status {
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; color: #B4A7FF; padding: 10px 0 2px;
}
.parse-status .spin {
  width: 14px; height: 14px; border-radius: 50%; margin-right: 8px;
  border: 2px solid rgba(139, 124, 255, 0.25); border-top-color: var(--brand);
  animation: rot 0.8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

.engine-badge {
  display: flex; align-items: center; font-size: 11.5px; color: var(--t3);
  padding: 10px 2px 4px;
}
.engine-badge svg { width: 12px; height: 12px; margin-right: 5px; color: var(--brand); }
.engine-badge b { color: var(--t2); font-weight: 600; }

/* 解析结果卡 */
.pcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 12px; animation: fadeUp 0.34s ease both; }
.pcard.checked { border-color: var(--brand-line); background: rgba(139, 124, 255, 0.06); }
.pcard-head { display: flex; align-items: flex-start; }
.cb {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-right: 11px; margin-top: 1px;
  border: 2px solid rgba(255, 255, 255, 0.28); display: flex; align-items: center; justify-content: center;
  transition: all 0.16s ease; color: transparent;
}
.pcard.checked .cb { background: linear-gradient(135deg, #7C6BFF, #9B8FFF); border-color: transparent; color: #fff; box-shadow: 0 3px 10px rgba(124, 107, 255, 0.4); }
.cb svg { width: 12px; height: 12px; }
.pcard-name { flex: 1; font-size: 14.5px; font-weight: 700; line-height: 1.4; }
.pcard-due { font-size: 12px; color: var(--t2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pcard .chips { margin-top: 8px; }
.pcard-grid { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }

.actionbar {
  position: sticky; bottom: calc(var(--dock-h) + 26px); z-index: 20;
  display: flex; margin-top: 14px;
  background: rgba(16, 19, 27, 0.96); border: 1px solid var(--line);
  border-radius: 15px; padding: 8px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
}
.actionbar .btn-primary { flex: 1; padding: 11px 14px; }
.actionbar .btn-ghost { margin-right: 8px; }
</style>
<style>
/* ---------- 月历 ---------- */
.cal-head { display: flex; align-items: center; margin-bottom: 14px; }
.cal-title { flex: 1; text-align: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
.cal-nav {
  width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--t2); font-size: 17px;
}
.cal-nav:active { background: var(--surface-2); }
.cal-today-link { font-size: 12px; color: #A99BFF; padding: 8px 6px; margin-left: 8px; }

.cal-week {
  display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px;
  font-size: 11px; color: var(--t3); text-align: center; letter-spacing: 1px;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 3px; }
.cal-cell {
  position: relative; height: 40px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 13px; color: var(--t1); font-variant-numeric: tabular-nums;
}
.cal-cell.dim { color: var(--t3); opacity: 0.42; }
.cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--brand-line); color: #B4A7FF; font-weight: 700; }
.cal-cell.sel { background: linear-gradient(135deg, #7C6BFF, #9B8FFF); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(124, 107, 255, 0.35); }
.cal-cell:active { background: var(--surface-2); }
.cal-dots { display: flex; margin-top: 3px; height: 4px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; margin: 0 1.5px; }

.cal-day-head { display: flex; align-items: baseline; margin: 16px 2px 10px; }
.cal-day-title { font-size: 15px; font-weight: 700; }
.cal-day-cnt { font-size: 12px; color: var(--t3); margin-left: 8px; }
.cal-row {
  display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; padding: 12px 14px; margin-bottom: 9px;
}
.cal-row:active { background: var(--surface-2); }
.cal-row-name { flex: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-row-due { font-size: 11.5px; color: var(--t2); font-variant-numeric: tabular-nums; margin-left: 10px; flex-shrink: 0; }

/* ---------- 我的 ---------- */
.form-row { display: flex; align-items: center; background: rgba(0, 0, 0, 0.22); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 0 13px; }
.form-row .fr-label { width: 76px; flex-shrink: 0; font-size: 12.5px; color: var(--t2); }
.form-row input, .form-row select {
  flex: 1; background: none; border: 0; outline: none; padding: 12px 0; font-size: 14px;
  -webkit-appearance: none; appearance: none;
}
.form-row select { color: var(--t1); }
.form-row input::placeholder { color: var(--t3); }
.form-row:focus-within { border-color: var(--brand-line); box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.1); }

.day-chips { display: flex; flex-wrap: wrap; margin-left: -5px; }
.day-chip {
  padding: 7px 15px; margin: 0 5px 8px 0; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); color: var(--t2);
}
.day-chip.on { background: rgba(139, 124, 255, 0.13); border-color: var(--brand-line); color: #B4A7FF; }
.day-custom { display: flex; align-items: center; }
.day-custom input {
  width: 60px; text-align: center; padding: 7px 0;
  background: rgba(0, 0, 0, 0.22); border: 1px solid var(--line);
  border-radius: 999px; color: var(--t1); outline: none; font-size: 12.5px;
}
.day-custom .unit { font-size: 12px; color: var(--t3); margin-left: 6px; }

.list-row {
  display: flex; align-items: center; padding: 13px 2px;
  border-bottom: 1px solid var(--line);
}
.list-row:last-child { border-bottom: 0; }
.list-row .lr-ico {
  width: 34px; height: 34px; border-radius: 10px; margin-right: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--brand-soft); color: #B4A7FF;
}
.list-row.danger .lr-ico { background: rgba(255, 93, 93, 0.12); color: #FF8A80; }
.list-row .lr-txt { flex: 1; }
.list-row .lr-name { font-size: 14px; font-weight: 600; }
.list-row .lr-sub { font-size: 11.5px; color: var(--t3); margin-top: 1px; }
.list-row .lr-arr { color: var(--t3); display: flex; }

.about-txt { font-size: 12px; color: var(--t3); line-height: 1.9; }
.about-txt b { color: var(--t2); font-weight: 600; }

/* ---------- 底部 Dock ---------- */
.dock {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 432px; z-index: 40;
  display: flex; padding: 7px 6px;
  background: rgba(16, 19, 27, 0.94); border: 1px solid var(--line-2);
  border-radius: 20px; box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
}
@supports (bottom: max(12px, env(safe-area-inset-bottom))) {
  .dock { bottom: max(12px, env(safe-area-inset-bottom)); }
}
.dock-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5px 0 4px; border-radius: 14px; color: var(--t3);
  transition: color 0.18s ease, background 0.18s ease;
}
.dock-btn .db-ico { height: 21px; display: flex; }
.dock-btn .db-label { font-size: 10px; font-weight: 600; margin-top: 2px; letter-spacing: 0.5px; }
.dock-btn.on { color: #B4A7FF; background: rgba(139, 124, 255, 0.12); }
.dock-btn.on .db-label {
  background: linear-gradient(135deg, #9B8FFF, #5EEAD4);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ---------- Toast / Modal ---------- */
.toast {
  position: fixed; bottom: calc(var(--dock-h) + 40px); left: 50%; transform: translateX(-50%) translateY(8px);
  z-index: 90; max-width: 82%;

<script>
"use strict";
/* =========================================================================
 * 解析引擎 —— 由 award_tracker.py → award-parser.ts 移植为纯 JS
 * 兼容性目标：Chromium 60+（避免 lookbehind / ?. / ?? / matchAll / flatMap）
 * ========================================================================= */
var AWARD = (function () {

  var GRADE_ORDER = { "大一": 1, "大二": 2, "大三": 3, "大四": 4, "大五": 5, "研究生": 6, "硕士": 6, "博士": 7 };

  var MAJOR_GROUPS = [
    ["影视传媒类", ["摄影", "摄像", "影视", "传媒", "新闻", "传播", "广告", "编导", "广播电视", "戏文", "戏剧", "动画", "数字媒体", "视觉传达"]],
    ["艺术设计类", ["设计", "艺术", "美术", "视觉传达"]],
    ["文法政法类", ["中文", "文学", "外语", "英语", "法学", "法律", "知识产权", "知产", "教育", "心理"]],
    ["理工科类", ["计算机", "软件", "人工智能", "理工", "工科", "理科", "机械", "土木", "建筑", "电子", "自动化"]],
    ["经管类", ["经管", "经济", "管理", "金融", "会计", "工商"]]
  ];

  var KW_SET = {};
  MAJOR_GROUPS.forEach(function (g) { g[1].forEach(function (k) { KW_SET[k] = true; }); });
  var MAJOR_KEYWORDS = Object.keys(KW_SET);

  var FUZZY_TIME_WORDS = ["近期", "尽快", "另行通知", "额满即止", "招满即止", "择期", "待定"];

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  /* ---------- 名称 ---------- */
  function extractName(text) {
    var body = text.trim().replace(/^\s*\d{1,2}[.、)）]\s*/, "");
    var m = /关于[开展举办组织评选]{0,4}?(.{4,40}?)(?:的)?(?:通知|公告|邀请函)/.exec(body);
    if (m) return m[1].trim();
    m = /([\u4e00-\u9fa5A-Za-z0-9·\-]{2,30}(?:大赛|竞赛|比赛|挑战杯|杯赛|评选|奖学金|招募|征集|计划|活动|讲座|论坛|志愿者))/.exec(body);
    if (m) {
      var name = m[1].replace(/^(举办|开展|组织|参加|关于)/, "");
      return name.slice(0, 40);
    }
    var lines = body.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim().replace(/^[【】\[\]「」\s]+/, "").replace(/[【】\[\]「」\s]+$/, "").replace(/^\d{1,2}[.、)）]\s*/, "");
      if (line.length >= 4 && !/^(各位|同学|通知|大家好)/.test(line)) return line.slice(0, 30);
    }
    return "未注明";
  }

  /* ---------- 截止时间 ---------- */
  function extractDeadline(text, now) {
    now = now || new Date();
    var m = /(20\d{2})[年\-/](\d{1,2})[月\-/](\d{1,2})[日号]?/.exec(text);
    var yearInfer = false;
    if (!m) { m = /(\d{1,2})[月\-/](\d{1,2})[日号]/.exec(text); yearInfer = true; }
    if (!m) {
      for (var i = 0; i < FUZZY_TIME_WORDS.length; i++) {
        if (text.indexOf(FUZZY_TIME_WORDS[i]) >= 0) return { deadline: "未注明", note: "原文仅给出模糊时间（近期/尽快等）" };
      }
      return { deadline: "未注明", note: "" };
    }
    var year, month, day;
    if (yearInfer) { year = now.getFullYear(); month = parseInt(m[1], 10); day = parseInt(m[2], 10); }
    else { year = parseInt(m[1], 10); month = parseInt(m[2], 10); day = parseInt(m[3], 10); }

    var dt = new Date(year, month - 1, day);
    if (dt.getFullYear() !== year || dt.getMonth() !== month - 1 || dt.getDate() !== day) {
      return { deadline: "未注明", note: "原文日期格式无法解析" };
    }
    if (yearInfer) {
      var diff = now.getTime() - dt.getTime();
      if (diff > 30 * 86400000) dt.setFullYear(year + 1);
    }
    var note = "";
    var tm = /(\d{1,2})[:：](\d{2})/.exec(text) || /(\d{1,2})\s*点/.exec(text);
    if (tm) {
      var minute = tm[2] !== undefined ? parseInt(tm[2], 10) : 0;
      dt.setHours(parseInt(tm[1], 10), minute, 0, 0);
    } else {
      dt.setHours(23, 59, 0, 0);
      note = "原文未注明时刻，按当日 23:59 计";
    }
    return {
      deadline: dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate()) + " " + pad2(dt.getHours()) + ":" + pad2(dt.getMinutes()),
      note: note
    };
  }

  /* ---------- 链接 / 材料 / 报名方式 ---------- */
  function extractLink(text) {
    var m = /https?:\/\/[^\s，。、）)\]】]+/.exec(text);
    return m ? m[0] : "";
  }

  function extractMaterials(text) {
    var patterns = [
      /材料[需为]?[:：]?\s*([^。；\n]{2,40})/,
      /需(?:提交|准备|提供)\s*([^。；\n]{2,40})/,
      /提交[:：]\s*([^。；\n]{2,40})/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = patterns[i].exec(text);
      if (m) return m[1].replace(/^[：:，,\s]+/, "").replace(/[：:，,\s]+$/, "");
    }
    return "";
  }

  function extractMethod(text) {
    if (extractLink(text)) return "官网在线报名";
    var mail = /[\w.\-]+@[\w.\-]+\.\w+/.exec(text);
    if (mail) return "邮件报名：" + mail[0];
    var kws1 = ["扫码", "二维码", "扫描"];
    for (var i = 0; i < kws1.length; i++) if (text.indexOf(kws1[i]) >= 0) return "扫码报名（二维码见原文）";
    var kws2 = ["进群", "加群", "群内", "群里"];
    for (var j = 0; j < kws2.length; j++) if (text.indexOf(kws2[j]) >= 0) return "群内报名";
    if (text.indexOf("私聊") >= 0) return "私聊联系人报名";
    var kws3 = ["官网", "网站", "系统", "平台", "表单", "问卷"];
    for (var k = 0; k < kws3.length; k++) if (text.indexOf(kws3[k]) >= 0) return "通过" + kws3[k] + "提交（原文未给具体地址）";
    if (/(交|报)至|交给|提交给/.test(text)) {
      var m = /(?:(?:交|报)至|交给|提交给)([^\s，。]{2,20})/.exec(text);
      if (m) return "线下提交至：" + m[1];
    }
    return "未注明";
  }

  /* ---------- 年级 ---------- */
  function extractGrade(text, now) {
    now = now || new Date();
    var ALL = ["全体年级", "全体学生", "全体在校生", "全校学生", "所有年级", "在校生"];
    for (var a = 0; a < ALL.length; a++) if (text.indexOf(ALL[a]) >= 0) return "全体年级";

    var found = [];
    var grades = ["大一", "大二", "大三", "大四", "大五", "研究生", "硕士", "博士"];
    for (var b = 0; b < grades.length; b++) if (text.indexOf(grades[b]) >= 0) found.push(grades[b]);

    var cls = [], cm;
    var clsRe = /(20\d{2})级/g;
    while ((cm = clsRe.exec(text)) !== null) cls.push(cm[1]);
    for (var c = 0; c < cls.length; c++) {
      var n = now.getFullYear() - parseInt(cls[c], 10) + (now.getMonth() + 1 >= 9 ? 1 : 0);
      var lab = { 1: "大一", 2: "大二", 3: "大三", 4: "大四", 5: "大五" }[n];
      if (lab && found.indexOf(lab) < 0) found.push(lab);
    }
    if (text.indexOf("本科生") >= 0 && found.length === 0) return "本科生（未细分年级）";

    var rng = /(大一|大二|大三|大四|大五)\s*(?:至|到|-|—|~)\s*(大一|大二|大三|大四|大五)/.exec(text);
    if (rng) {
      var lo = GRADE_ORDER[rng[1]], hi = GRADE_ORDER[rng[2]], tmp;
      if (lo > hi) { tmp = lo; lo = hi; hi = tmp; }
      var expanded = [];
      var order5 = ["大一", "大二", "大三", "大四", "大五"];
      for (var e = 0; e < order5.length; e++) {
        var v = GRADE_ORDER[order5[e]];
        if (lo <= v && v <= hi) expanded.push(order5[e]);
      }
      if (expanded.length > 0) return expanded.join("、");
    }
    if (found.length === 0) return "未注明";
    if (/(及以上|以上|起)/.test(text) && found.length === 1) return found[0] + "及以上";
    found.sort(function (x, y) { return GRADE_ORDER[x] - GRADE_ORDER[y]; });
    return found.join("、");
  }

  /* ---------- 专业限制（避开 lookbehind：先匹配再检查前一个字符） ---------- */
  function scanNoBu(text, re) {
    var m, last = -1;
    while ((m = re.exec(text)) !== null) {
      if (m.index === 0 || text.charAt(m.index - 1) !== "不") return m[0];
      if (re.lastIndex === m.index) re.lastIndex++;
      last = re.lastIndex;
      if (m.index === last) break;
    }
    return null;
  }

  function parseMajorLimit(text) {
    var FREE = ["不限专业", "专业不限", "各专业", "所有专业"];
    for (var i = 0; i < FREE.length; i++) if (text.indexOf(FREE[i]) >= 0) return "不限专业";
    var m = scanNoBu(text, /限[^，。；\n]{0,20}专业/g);
    if (m) return m.trim();
    var simple = [/仅限[^，。；\n]{0,20}专业/, /面向[^，。；\n]{0,20}专业/, /要求[^，。；\n]{0,20}专业/, /[^，。；\n]{0,10}专业(?:学生|同学)?(?:可报|均可|优先)/];
    for (var s = 0; s < simple.length; s++) {
      var sm = simple[s].exec(text);
      if (sm) return sm[0].trim();
    }
    var m2 = scanNoBu(text, /限[^，。；\n]{0,12}(?:类|科|方向)(?:专业|学生|同学)?/g);
    if (m2) return m2.trim();
    return "不限专业";
  }

  /* ---------- 分块 ---------- */
  function isJunkBlock(block) {
    if (block.trim().length < 20) return true;
    if (!/截止|报名|参赛|招募|征集|评选|申请|20\d{2}|\d{1,2}月/.test(block)) return true;
    return false;
  }

  function splitBlocks(text) {
    var rough = text.split(/\n\s*\n+/);
    var out = [];
    rough.forEach(function (seg) {
      var lookRe = /\d{1,2}[.、)）]\s*\S/g;
      var cuts = [], m, lastCut = 0;
      while ((m = lookRe.exec(seg)) !== null) {
        if (m.index > 0) { cuts.push(m.index); lookRe.lastIndex = m.index + 1; }
        else lookRe.lastIndex++;
      }
      for (var i = 0; i < cuts.length; i++) { out.push(seg.slice(lastCut, cuts[i])); lastCut = cuts[i]; }
      out.push(seg.slice(lastCut));
    });
    return out;
  }

  function looksLikeTitle(block) {
    var t = block.trim();
    if (t.length < 6 || t.indexOf("\n") >= 0) return false;
    return /通知|公告|邀请函|大赛|竞赛|比赛|挑战杯|杯赛|评选|奖学金|招募|征集|计划|讲座|论坛|志愿者/.test(t);
  }

  function mergeTitleBlocks(blocks) {
    var merged = [];
    blocks.forEach(function (raw) {
      var b = raw.trim();
      if (!b) return;
      var prev = merged.length > 0 ? merged[merged.length - 1] : null;
      if (prev && looksLikeTitle(prev) && !looksLikeTitle(b)) merged[merged.length - 1] = prev + "\n" + b;
      else merged.push(b);
    });
    return merged;
  }

  function extractItems(text, now) {
    now = now || new Date();
    var blocks = mergeTitleBlocks(splitBlocks(text)).filter(function (b) { return b.length > 0 && !isJunkBlock(b); });
    var effective = blocks.length > 0 ? blocks : [text.trim()];
    var items = [];
    var max = Math.min(effective.length, 10);
    for (var i = 0; i < max; i++) {
      var block = effective[i];
      var dl = extractDeadline(block, now);
      items.push({
        name: extractName(block),
        deadline: dl.deadline,
        method: extractMethod(block),
        grade: extractGrade(block, now),
        majorLimit: parseMajorLimit(block),
        link: extractLink(block),
        materials: extractMaterials(block),
        note: dl.note
      });
    }
    return items;
  }

  /* ---------- 画像匹配 ---------- */
  function matchGrade(cfgGrade, itemGrade) {
    if (itemGrade === "未注明" || itemGrade === "") return "未知";
    if (itemGrade.indexOf("全体年级") >= 0 || itemGrade.indexOf("不限") >= 0) return "匹配";
    var base = GRADE_ORDER[String(cfgGrade).trim()];
    if (base === undefined) return "未知";
    if (itemGrade.indexOf("本科生") >= 0) return base <= 4 ? "匹配" : "不匹配";
    var found = [];
    var gs = ["大一", "大二", "大三", "大四", "大五", "研究生", "硕士", "博士"];
    for (var i = 0; i < gs.length; i++) if (itemGrade.indexOf(gs[i]) >= 0) found.push(GRADE_ORDER[gs[i]]);
    if (found.length === 0) return "未知";
    var mn = Math.min.apply(null, found);
    if (itemGrade.indexOf("及以上") >= 0) return base >= mn ? "匹配" : "不匹配";
    return found.indexOf(base) >= 0 ? "匹配" : "不匹配";
  }

  function matchMajorLabel(cfgMajor, limit) {
    if (!limit || limit === "不限专业") return "所有专业可报";
    var mj = String(cfgMajor).trim();
    if (mj && (limit.indexOf(mj) >= 0 || MAJOR_KEYWORDS.some(function (k) { return mj.indexOf(k) >= 0 && limit.indexOf(k) >= 0; }))) return "符合你的专业";
    for (var i = 0; i < MAJOR_GROUPS.length; i++) {
      var kws = MAJOR_GROUPS[i][1];
      var inLimit = kws.some(function (k) { return limit.indexOf(k) >= 0; });
      var inMajor = kws.some(function (k) { return mj.indexOf(k) >= 0; });
      if (inLimit && inMajor) return "符合你的专业";
    }
    return "专业可能不符，请自行确认";
  }

  function judge(items, profile) {
    var out = [];
    items.forEach(function (it) {
      var g = matchGrade(profile.grade || "", it.grade);
      var m = matchMajorLabel(profile.major || "", it.majorLimit);
      var verdict;
      if (m === "专业可能不符，请自行确认") verdict = "待确认";
      else if (g === "不匹配") verdict = "年级不符";
      else if (g === "未知") verdict = "待确认";
      else verdict = "符合";
      var row = {};
      Object.keys(it).forEach(function (k) { row[k] = it[k]; });
      row.fit = verdict;
      row.majorTag = m;
      out.push(row);
    });
    return out;
  }

  var FIT_ORDER = { "符合": 0, "待确认": 1, "年级不符": 2 };

  function analyze(text, profile, matchOnly) {
    var rows = judge(extractItems(text), profile);
    rows.sort(function (a, b) { return (FIT_ORDER[a.fit] !== undefined ? FIT_ORDER[a.fit] : 3) - (FIT_ORDER[b.fit] !== undefined ? FIT_ORDER[b.fit] : 3); });
    if (matchOnly) {
      var filtered = rows.filter(function (r) { return r.fit !== "年级不符"; });
      if (filtered.length > 0) return filtered;
    }
    return rows;
  }

  function rowsToRecords(rows) {
    var out = [];
    rows.forEach(function (r) {
      if (r.name === "未注明") return;
      var known = r.deadline && r.deadline !== "未注明";
      out.push({
        id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: r.name,
        deadline: known ? r.deadline.slice(0, 10) : "",
        deadlineTime: known && r.deadline.length >= 16 ? r.deadline.slice(11, 16) : "",
        method: r.method,
        link: r.link,
        materials: r.materials,
        majorLimit: r.majorLimit === "" ? "不限专业" : r.majorLimit,
        gradeLimit: r.grade === "" ? "未注明" : r.grade,
        fit: r.fit,
        note: r.note,
        added: new Date().toISOString().slice(0, 10)
      });
    });
    return out;
  }

  function countdown(deadline, today) {
    if (!deadline) return null;
    today = today || new Date();
    var parts = deadline.split("-");
    var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (!y || !mo || !d) return null;
    var dl = new Date(y, mo - 1, d);
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var left = Math.round((dl.getTime() - t0.getTime()) / 86400000);
    if (left < 0) return { left: left, span: "已过" + (-left) + "天", flag: "已过期" };
    if (left === 0) return { left: left, span: "今天", flag: "今天截止" };
    if (left <= 3) return { left: left, span: left + "天后", flag: "即将截止" };
    return { left: left, span: left + "天后", flag: "" };
  }

  return {
    GRADE_ORDER: GRADE_ORDER,
    extractItems: extractItems,
    analyze: analyze,
    judge: judge,
    rowsToRecords: rowsToRecords,
    countdown: countdown
  };
})();
</script>
<script>
"use strict";
/* =========================================================================
 * AI 解析引擎 —— agnes-2.5-flash（OpenAI 兼容 /chat/completions）
 * 失败自动回退本地规则（AWARD.analyze）
 * 兼容性：不用 AbortController / 可选链 / replaceAll
 * ========================================================================= */
var AI_CFG = {
  baseUrl: "https://apihub.agnes-ai.com/v1",
  apiKey: "sk-kwMetsNJdo3vYZ56PfciEjbcWQMZVtyUdh4D2Po1XkbykRXE",
  model: "agnes-2.5-flash",
  timeoutMs: 45000,
  maxTokens: 4000
};

var AI = (function () {

  function todayIso() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function buildSystemPrompt() {
    return [
      '你是「倒计时」App 内置的通知解析引擎，负责从大学生竞赛/评奖/奖学金/活动通知文本中提取结构化信息。',
      '',
      '只输出一个 JSON 对象，禁止 markdown 代码块、禁止任何解释性文字。输出格式：',
      '{"items":[{"name":"","deadline":"YYYY-MM-DD 或 null","time":"HH:MM 或 null","method":" 或 null","link":" 或 null","materials":[],"grade":" 或 null","major":" 或 null","note":" 或 null"}]}',
      '',
      '提取规则：',
      '1. 用户可能一次粘贴多条不同通知，每条提取为一个 item，顺序与原文一致',
      '2. name：通知的正式名称/标题（去掉「关于」「的通知」等外壳字样）',
      '3. deadline：报名或材料提交的截止日期。原文未写年份时，以今天（' + todayIso() + '）为基准推断最合理的将来日期；「本月底」「下周五」等相对表述换算为具体日期；确实没有截止日期填 null',
      '4. time：截止时刻（24 小时制 HH:MM）。原文无时刻信息填 null',
      '5. method：报名/提交方式的一句话概括，如「官网在线报名」「邮件报名至 xxx@xx.com」「扫码报名」「班级统一收集」',
      '6. link：原文中出现的报名/详情链接 URL，没有填 null',
      '7. materials：需要提交或准备的材料名称数组，没有填 []',
      '8. grade：年级限制原文要点，如「大二、大三」「全体本科生」，未提及填 null',
      '9. major：专业限制原文要点，如「限法学类专业」「不限专业」，未提及填 null',
      '10. note：其他值得注意的要点（如「需学院盖章」「每个团队限 3-5 人」），没有填 null',
      '11. 只提取原文明确出现或可直接换算的信息，绝不编造',
      '12. 输出必须是严格合法的 JSON：字符串值内部如出现英文双引号必须用反斜杠转义，或改用中文引号“”；不要用 markdown 代码块包裹'
    ].join('\n');
  }

  /* 从模型输出中稳健地抠出 JSON（容忍 ``` 围栏与前后杂文字） */
  function extractJson(content) {
    var t = String(content || "").trim();
    t = t.replace(/```json/gi, "```").replace(/```/g, "");
    var a = t.indexOf("{");
    if (a < 0) return null;
    var b = t.lastIndexOf("}");
    var slice = (b > a) ? t.slice(a, b + 1) : t.slice(a);
    try { return JSON.parse(slice); } catch (e) { /* 继续 */ }
    /* 修复一：模型常见错误——字符串值内部出现未转义的英文双引号 */
    var fixed = fixInnerQuotes(slice);
    try { return JSON.parse(fixed); } catch (e) { /* 继续 */ }
    /* 修复二：截断的 JSON——尝试补齐尾部括号 */
    var tails = ['"}]}', 'null}]}', '}]}'  ];
    for (var i = 0; i < tails.length; i++) {
      try { return JSON.parse(fixed + tails[i]); } catch (e) { /* 继续 */ }
    }
    return null;
  }

  /* 将字符串值内部未转义的英文双引号转义：结构引号的前后必是 { , : } 或结尾 */
  function fixInnerQuotes(t) {
    var out = [], n = t.length;
    for (var i = 0; i < n; i++) {
      var ch = t.charAt(i);
      if (ch !== '"') { out.push(ch); continue; }
      var j = i - 1;
      while (j >= 0 && /\s/.test(t.charAt(j))) j--;
      var prev = j >= 0 ? t.charAt(j) : "";
      var k = i + 1;
      while (k < n && /\s/.test(t.charAt(k))) k++;
      var next = k < n ? t.charAt(k) : "";
      var structural = prev === "{" || prev === "," || prev === ":" || next === ":" || next === "," || next === "}" || next === "" || next === "]" || prev === "[";
      out.push(structural ? '"' : '\\"');
    }
    return out.join("");
  }

  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
  function validTime(s) { return /^\d{1,2}:\d{2}$/.test(String(s)); }

  /* LLM item → 与本地解析器同构的 row（交由 AWARD.judge 打标） */
  function toItem(row) {
    var dl = validDate(row.deadline) ? row.deadline : null;
    var tm = validTime(row.time) ? row.time : null;
    var note = (row.note && String(row.note).trim()) || "";
    if (dl && !tm) note = note ? note + "；原文未注明时刻，按当日 23:59 计" : "原文未注明时刻，按当日 23:59 计";
    var mats = [];
    if (Object.prototype.toString.call(row.materials) === "[object Array]") {
      row.materials.forEach(function (m) {
        var s = String(m || "").trim();
        if (s) mats.push(s);
      });
    } else if (typeof row.materials === "string" && row.materials.trim()) {
      mats = row.materials.trim().split(/[、;；,，]\s*/).filter(function (x) { return x; });
    }
    return {
      name: (row.name && String(row.name).trim()) || "",
      deadline: dl ? (dl + " " + (tm || "23:59")) : "未注明",
      method: (row.method && String(row.method).trim()) || "未注明",
      grade: (row.grade && String(row.grade).trim()) || "未注明",
      majorLimit: (row.major && String(row.major).trim()) || "不限专业",
      link: (row.link && String(row.link).trim()) || "",
      materials: mats.join("、"),
      note: note
    };
  }

  /* 主入口：Promise<rows>（已 judge + 排序，失败 reject） */
  function parse(text) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; reject(new Error("timeout")); }
      }, AI_CFG.timeoutMs);

      fetch(AI_CFG.baseUrl + "/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + AI_CFG.apiKey
        },
        body: JSON.stringify({
          model: AI_CFG.model,
          messages: [
            { role: "system", content: buildSystemPrompt() },
            { role: "user", content: text }
          ],
          temperature: 0,
          max_tokens: AI_CFG.maxTokens,
          response_format: { type: "json_object" }
        })
      }).then(function (resp) {
        return resp.json();
      }).then(function (data) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        var content = data && data.choices && data.choices[0] &&
          data.choices[0].message && data.choices[0].message.content;
        if (!content) { reject(new Error("empty")); return; }
        var obj = extractJson(content);
        if (!obj || !obj.items || !obj.items.length) { reject(new Error("no-items")); return; }
        var items = obj.items.map(toItem).filter(function (it) { return it.name; });
        if (!items.length) { reject(new Error("bad-items")); return; }
        resolve(items);
      }).catch(function (err) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        reject(err);
      });
    });
  }

  return { parse: parse };
})();

<script>
"use strict";

 * 倒计时 v2 —— App 状态与首页（倒计时卡片 / 环形进度）

/* ---------- 工具 ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function todayIso() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
var WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];
function fmtMD(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  var p = iso.split("-");
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  return parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日 周" + WEEK_CN[d.getDay()];
}

/* ---------- Toast / Modal ---------- */
var toastTimer = null;

  t.innerHTML = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

var modalCb = null;
function confirmModal(title, body, okText, brand, cb) {
  $("modalTitle").innerHTML = title;
  $("modalBody").innerHTML = body;

  calY: new Date().getFullYear(), calM: new Date().getMonth() + 1,

function persist() {

  } catch (e) { }
}
function loadStore() {

/* ---------- 倒计时/紧急度 ---------- */
function daysLeft(rec) {
  if (!rec.deadline) return null;
  var cd = AWARD.countdown(rec.deadline);
  return cd ? cd.left : null;
}
function urgency(rec) {
  var d = daysLeft(rec);
  if (d === null) return { cls: "urg-none", color: "rgba(255,255,255,0.30)", num: "—", unit: "无截止", frac: 0, dashed: true };
  if (d < 0) return { cls: "urg-red", color: "#FF5D5D", num: String(-d), unit: "天前", frac: 1 };
  if (d === 0) return { cls: "urg-coral", color: "#FF7A6B", num: "今", unit: "天截止", frac: 1 };
  if (d <= 3) return { cls: "urg-coral", color: "#FF7A6B", num: String(d), unit: "天截止", frac: d / 60 };
  if (d <= 7) return { cls: "urg-amber", color: "#FFC24B", num: String(d), unit: "天截止", frac: d / 60 };
  if (d <= 15) return { cls: "urg-violet", color: "#8B7CFF", num: String(d), unit: "天截止", frac: d / 60 };
  return { cls: "urg-teal", color: "#5EEAD4", num: String(d), unit: "天截止", frac: d / 60 };
}
var RING_C = 169.65;

function fitChipCls(fit) {
  if (fit === "符合") return "fit";
  if (fit === "年级不符") return "mismatch";
  return "unsure";
}

/* ---------- 首页渲染 ---------- */
function recordCard(rec, idx) {
  var u = urgency(rec);
  var d = daysLeft(rec);
  var open = S.openIds[rec.id] ? " open" : "";
  var dueTxt;
  if (rec.deadline) {
    if (d < 0) dueTxt = "已于 " + fmtMD(rec.deadline) + " 截止";
    else if (d === 0) dueTxt = '<span class="dd-today">今天 ' + esc(rec.deadlineTime || "23:59") + " 截止</span>";
    else dueTxt = fmtMD(rec.deadline) + " " + esc(rec.deadlineTime || "23:59") + " 截止";
  } else {
    dueTxt = "截止时间未注明" + (rec.note && rec.note.indexOf("模糊") >= 0 ? "（原文：近期/尽快）" : "");
  }

  var chips = "";
  chips += '<span class="chip ' + fitChipCls(rec.fit) + '">' + esc(rec.fit || "待确认") + "</span>";
  if (rec.gradeLimit && rec.gradeLimit !== "未注明" && rec.gradeLimit !== "全体年级") {
    chips += '<span class="chip">' + esc(rec.gradeLimit.length > 12 ? rec.gradeLimit.slice(0, 12) + "…" : rec.gradeLimit) + "</span>";
  }
  if (rec.materials) chips += '<span class="chip brand">材料 ' + rec.materials.split(/[、;；,，]/).filter(function (x) { return x.trim(); }).length + " 项</span>";
  if (rec.link) chips += '<span class="chip link">有链接</span>';

  var dots = u.dashed ? ' stroke-dasharray="3 6"' : "";

    '<circle class="ring-fg" cx="32" cy="32" r="27" fill="none" stroke-width="5" stroke="' + u.color +
    '" stroke-linecap="round" stroke-dasharray="169.65" stroke-dashoffset="169.65" data-off="' + (RING_C * (1 - Math.max(0.04, Math.min(1, u.frac)))).toFixed(1) + '"/>' +
    "</svg>" +
    '<div class="ring-mid"><div class="ring-num" style="color:' + u.color + '">' + u.num + '</div><div class="ring-unit">' + u.unit + "</div></div>" +

    ring +

    '<div class="rcard-name">' + esc(rec.name) + "</div>" +
    '<div class="rcard-date">' + dueTxt + "</div>" +
    '<div class="chips">' + chips + "</div>" +
    '<div class="rcard-detail">' +
    (detail || '<div class="drow"><div class="v" style="color:var(--t3)">暂无更多细节</div></div>') +
    '<div class="rcard-actions">' +
    '<span class="added-at">入库于 ' + esc(rec.added || "") + "</span>" +
    '<button class="btn-danger-txt del-btn" data-id="' + esc(rec.id) + '">' +
    '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
    "删除</button>" +
    "</div></div>" +
    "</div></div>";
}

function renderHome() {
  var today = new Date();
  $("homeDate").textContent = (today.getMonth() + 1) + "月" + today.getDate() + "日 · 周" + WEEK_CN[today.getDay()] +
    (S.records.length ? " · 共 " + S.records.length + " 项" : "");

  var q = S.query.trim().toLowerCase();
  var near = [], over = [], nodate = [], up = [];
  S.records.forEach(function (r) {
    if (q && r.name.toLowerCase().indexOf(q) < 0) return;
    var d = daysLeft(r);
    if (d === null) nodate.push(r);
    else if (d < 0) over.push(r);
    else up.push(r);
    if (d !== null && d >= 0 && d <= S.profile.reminderDays) near.push(r);
  });
  up.sort(function (a, b) { return a.deadline < b.deadline ? -1 : 1; });
  over.sort(function (a, b) { return a.deadline > b.deadline ? -1 : 1; });

  $("cntAll").textContent = S.records.length ? "(" + S.records.length + ")" : "";
  $("cntNear").textContent = near.length ? "(" + near.length + ")" : "";
  $("cntOver").textContent = over.length ? "(" + over.length + ")" : "";
  $("cntNodate").textContent = nodate.length ? "(" + nodate.length + ")" : "";

  var list;
  if (S.filter === "near") list = near;
  else if (S.filter === "over") list = over;

  var html = "";

    var fgs = document.querySelectorAll("#homeList .ring-fg");
    for (var i = 0; i < fgs.length; i++) {
      fgs[i].style.strokeDashoffset = fgs[i].getAttribute("data-off");
    }
  }, 40);

  renderUrgent(near, up);
}

function renderUrgent(near, up) {
  var chip = $("urgentChip");
  if (near.length > 0) {
    chip.classList.remove("hidden");
    chip.innerHTML = '<span class="dot"></span>' + near.length + " 项临近";
  } else {
    chip.classList.add("hidden");
  }
  var banner = $("urgentBanner");
  if (near.length > 0 && !S.alertDismissed) {
    var first = up.length ? up[0] : near[0];
    var d = daysLeft(first);
    var txt = "有 <b>" + near.length + "</b> 项临近截止";
    if (first && d !== null) txt += " · 「" + esc(first.name.slice(0, 14)) + "」还剩 <b>" + (d === 0 ? "今天" : d + " 天") + "</b>";
    banner.innerHTML = '<span class="ub-txt">' + txt + '</span><button class="ub-close" id="ubClose"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>';
    banner.classList.remove("hidden");
    var ub = $("ubClose");
    if (ub) ub.onclick = function () { S.alertDismissed = true; banner.classList.add("hidden"); };
  } else {
    banner.classList.add("hidden");
  }
}

function deleteRecord(id) {
  var rec = null;
  S.records = S.records.filter(function (r) { if (r.id === id) { rec = r; return false; } return true; });
  persist();
  renderHome();

  if (rec) toast("已删除「" + esc(rec.name.slice(0, 16)) + "」");
}

function rejudgeAll() {
  if (!S.records.length) return 0;
  var items = S.records.map(function (r) {
    return { name: r.name, deadline: "", method: "", grade: r.gradeLimit || "未注明", majorLimit: r.majorLimit || "不限专业", link: "", materials: "", note: "" };
  });
  var judged = AWARD.judge(items, S.profile);
  S.records.forEach(function (r, i) { r.fit = judged[i].fit; });
  return S.records.length;
}

<script>
"use strict";
/* =========================================================================
 * 倒计时 v2 —— 解析流程 / 月历 / 我的 / 路由与初始化
 * ========================================================================= */

/* ---------- Tab 路由 ---------- */
function switchTab(tab) {
  S.tab = tab;
  ["home", "parse", "cal", "me"].forEach(function (t) {
    $("view-" + t).classList.toggle("on", t === tab);
  });
  var btns = document.querySelectorAll("#dock .dock-btn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-tab") === tab);
  window.scrollTo(0, 0);
  if (tab === "cal") renderCal();
}

/* ---------- 解析流程 ---------- */
function localParse(text) {
  return AWARD.analyze(text, S.profile);
}

function finishParse(rows, engineLabel) {
  S.parsedRows = rows;
  S.parsedEngine = engineLabel;
  S.checked = {};
  rows.forEach(function (r, i) { S.checked["p" + i] = true; });
  $("engineBadge").classList.remove("hidden");
  $("engineBadge").innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 2a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.7a2 2 0 0 0-1.3-1.3L3 12l5.8-2a2 2 0 0 0 1.3-1.3L12 3z"/></svg>' +
    "已解析出 <b>" + rows.length + "</b> 条 · 引擎：<b>" + esc(engineLabel) + "</b>";
  renderParseResults();
}

function renderParseResults() {
  var rows = S.parsedRows || [];
  var html = "";
  rows.forEach(function (r, i) {
    var key = "p" + i;
    var on = S.checked[key] ? " checked" : "";
    var due;
    if (r.deadline && r.deadline !== "未注明") {
      var cd = AWARD.countdown(r.deadline.slice(0, 10));
      due = fmtMD(r.deadline.slice(0, 10)) + " " + (r.deadline.length >= 16 ? r.deadline.slice(11, 16) : "23:59") + " 截止";
      if (cd) due += " · " + cd.span;
    } else due = "截止时间未注明";

    function prow(k, v) { return v ? '<div class="drow"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>" : ""; }
    var grid = "";
    grid += prow("截止", esc(due));
    grid += prow("方式", esc(r.method));
    grid += prow("材料", esc(r.materials));
    grid += prow("年级", esc(r.grade));
    grid += prow("专业", esc(r.majorLimit));
    grid += prow("链接", r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.link) + "</a>" : "");

    html += '<div class="pcard' + on + '" data-key="' + key + '">' +

      '<div style="flex:1;min-width:0">' +
      '<div class="pcard-name">' + esc(r.name) + "</div>" +
      '<div class="pcard-due">' + esc(due) + "</div>" +
      "</div></div>" +
      '<div class="chips"><span class="chip ' + fitChipCls(r.fit) + '">' + esc(r.fit) + '</span><span class="chip">' + esc(r.majorTag || "") + "</span></div>" +
      '<div class="pcard-grid">' + grid + "</div>" +
      "</div>";
  });
  $("parseResults").innerHTML = html;
  updateSaveBar();
}

function updateSaveBar() {
  var rows = S.parsedRows || [];
  var n = 0;
  rows.forEach(function (r, i) { if (S.checked["p" + i]) n++; });
  var bar = $("parseAction");
  if (!rows.length) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  $("btnSaveTxt").textContent = "入库所选 (" + n + ")";
  $("btnCheckAll").textContent = (n === rows.length && n > 0) ? "取消全选" : "全选";
  $("btnSave").disabled = n === 0;
}

function runParse() {
  var text = $("noticeText").value.trim();
  if (!text) { toast("先粘贴通知原文，或点「填入示例」"); return; }
  if (S.engine === "local") {
    finishParse(localParse(text), "本地规则");

  }
  var btn = $("btnParse"), txt = $("btnParseTxt"), st = $("parseStatus");
  btn.disabled = true;

  txt.textContent = "AI 解析中…";

  var done = false;
  AI.parse(text).then(function (items) {
    if (done) return; done = true;
    var rows = AWARD.judge(items, S.profile);
    rows.sort(function (a, b) {
      var O = { "符合": 0, "待确认": 1, "年级不符": 2 };
      return (O[a.fit] !== undefined ? O[a.fit] : 3) - (O[b.fit] !== undefined ? O[b.fit] : 3);

function saveChecked() {
  var rows = S.parsedRows || [];
  var picked = [];
  rows.forEach(function (r, i) { if (S.checked["p" + i]) picked.push(r); });
  if (!picked.length) { toast("先勾选要入库的条目"); return; }
  var recs = AWARD.rowsToRecords(picked);
  var added = 0, skipped = 0;
  recs.forEach(function (r) {
    var dup = S.records.some(function (x) { return x.name === r.name && x.deadline === r.deadline; });
    if (dup) { skipped++; return; }
    S.records.push(r); added++;

/* ---------- 月历 ---------- */
function renderCal() {
  $("calTitle").textContent = S.calY + "年" + S.calM + "月";

  var offset = (first.getDay() + 6) % 7; /* 周一开头 */

    } else { dayNum = i - offset - daysIn + 1; dim = true; cellIso = ""; }

    var cls = "cal-cell" + (dim ? " dim" : "");

  } else {

}

function calShift(n) {
  S.calM += n;

  if (S.calM < 1) { S.calM = 12; S.calY--; }

  var fname = "daojishi-backup-" + todayIso() + ".json";
  try {
    var blob = new Blob([data], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  } catch (e) { }
  confirmModal(
    "备份已生成",
    "共 <b>" + S.records.length + "</b> 条记录 · 画像与设置已包含。<br>文件名：" + esc(fname) + "<br><br>也可以直接复制 JSON 文本留存：",
    "复制 JSON", true, function () {
      copyText(data);
      return true;
    }
  );
}
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast("已复制到剪贴板"); }, function () { copyFallback(txt); });
  } else copyFallback(txt);
}
function copyFallback(txt) {
  try {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("已复制到剪贴板");
  } catch (e) { toast("复制失败，请长按选择文本"); }
}
function importData(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var obj = JSON.parse(String(reader.result));
      var recs = obj && obj.records;
      if (Object.prototype.toString.call(recs) !== "[object Array]") throw new Error("bad");
      confirmModal("导入备份", "将导入 <b>" + recs.length + "</b> 条记录" +
        (obj.profile ? " 并覆盖画像" : "") + "，同名同截止的记录会自动跳过。", "导入", true, function () {
          if (obj.profile) {
            ["name", "college", "grade", "major"].forEach(function (k) {
              if (typeof obj.profile[k] === "string") S.profile[k] = obj.profile[k];
            });
            var rd = parseInt(obj.profile.reminderDays, 10);
            if (rd >= 1 && rd <= 30) S.profile.reminderDays = rd;
          }
          var added = 0;
          recs.forEach(function (r) {
            if (!r || !r.name) return;
            var dup = S.records.some(function (x) { return x.name === r.name && x.deadline === (r.deadline || ""); });
            if (dup) return;
            S.records.push({
              id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
              name: r.name, deadline: r.deadline || "", deadlineTime: r.deadlineTime || "",
              method: r.method || "未注明", link: r.link || "", materials: r.materials || "",
              majorLimit: r.majorLimit || "不限专业", gradeLimit: r.gradeLimit || "未注明",
              fit: r.fit || "待确认", note: r.note || "", added: r.added || todayIso()
            });
            added++;
          });
          persist();
          fillProfileForm();
          renderHome();
          renderCal();
          toast("已导入 " + added + " 条记录");
          return true;
        });
    } catch (e) {
      toast("文件不是有效的倒计时备份");
    }
  };
  reader.readAsText(file);
}

/* ---------- 事件绑定与初始化 ---------- */
function bindEvents() {
  /* Dock */
  var btns = document.querySelectorAll("#dock .dock-btn");
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.onclick = function () { switchTab(b.getAttribute("data-tab")); };
    })(btns[i]);
  }

  /* 首页 */
  $("btnGoParse").onclick = function () { switchTab("parse"); };
  $("emptyGoParse").onclick = function () { switchTab("parse"); };
  $("urgentChip").onclick = function () {
    S.filter = "near";
    var seg = document.querySelectorAll("#homeSeg button");
    for (var i = 0; i < seg.length; i++) seg[i].classList.toggle("on", seg[i].getAttribute("data-f") === "near");
    switchTab("home");
    renderHome();
  };
  var segBtns = document.querySelectorAll("#homeSeg button");
  for (var s = 0; s < segBtns.length; s++) {
    (function (b) {
      b.onclick = function () {
        S.filter = b.getAttribute("data-f");
        for (var j = 0; j < segBtns.length; j++) segBtns[j].classList.toggle("on", segBtns[j] === b);
        renderHome();
      };
    })(segBtns[s]);
  }
  $("homeQuery").oninput = function () { S.query = this.value; renderHome(); };

  /* 卡片展开 / 删除（事件委托） */
  $("homeList").onclick = function (ev) {
    var del = ev.target.closest ? ev.target.closest(".del-btn") : null;
    if (del) {
      var id = del.getAttribute("data-id");
      var rec = null;
      S.records.forEach(function (r) { if (r.id === id) rec = r; });
      confirmModal("删除记录", "确定删除「" + esc(rec ? rec.name : "") + "」？删除后不可恢复。", "删除", false, function () {
        deleteRecord(id);
        return true;
      });
      return;
    }
    var a = ev.target.closest ? ev.target.closest("a") : null;
    if (a) return; /* 链接正常打开 */
    var card = ev.target.closest ? ev.target.closest(".rcard") : null;
    if (card && card.getAttribute("data-id")) {
      var cid = card.getAttribute("data-id");
      S.openIds[cid] = !S.openIds[cid];
      card.classList.toggle("open");
    }
  };

  /* 解析页 */
  $("noticeText").oninput = function () {
    $("taCount").textContent = this.value.length + " 字";
  };
  $("btnDemo").onclick = function () {
    $("noticeText").value = DEMO_TEXT;
    $("taCount").textContent = DEMO_TEXT.length + " 字";
    toast("已填入 3 条示例通知，点「开始解析」试试");
  };
  var pills = document.querySelectorAll("#enginePills .engine-pill");
  for (var p = 0; p < pills.length; p++) {
    (function (b) {
      b.onclick = function () {
        S.engine = b.getAttribute("data-engine");
        for (var j = 0; j < pills.length; j++) pills[j].classList.toggle("on", pills[j] === b);
        persist();
      };
    })(pills[p]);
  }
  $("btnParse").onclick = runParse;
  $("parseResults").onclick = function (ev) {
    var card = ev.target.closest ? ev.target.closest(".pcard") : null;
    if (!card) return;
    var key = card.getAttribute("data-key");
    S.checked[key] = !S.checked[key];
    card.classList.toggle("checked");
    updateSaveBar();
  };
  $("btnCheckAll").onclick = function () {
    var rows = S.parsedRows || [];
    var all = rows.length > 0;
    rows.forEach(function (r, i) { if (!S.checked["p" + i]) all = false; });
    rows.forEach(function (r, i) { S.checked["p" + i] = !all; });
    renderParseResults();
  };
  $("btnSave").onclick = saveChecked;

  /* 月历 */
  $("calPrev").onclick = function () { calShift(-1); };
  $("calNext").onclick = function () { calShift(1); };
  $("calTodayLink").onclick = function () {
    var t = new Date();
    S.calY = t.getFullYear(); S.calM = t.getMonth() + 1; S.pickedDay = todayIso();
    renderCal();
  };
  $("calGrid").onclick = function (ev) {
    var cell = ev.target.closest ? ev.target.closest(".cal-cell") : null;
    if (!cell || cell.disabled) return;
    var iso = cell.getAttribute("data-iso");
    if (!iso) return;
    S.pickedDay = iso;
    renderCal();
  };

  /* 我的 */
  ["pfName", "pfCollege", "pfGrade", "pfMajor", "pfDays"].forEach(function (id) {
    $(id).oninput = function () { $("btnSaveProfile").disabled = false; };
    $(id).onchange = function () { $("btnSaveProfile").disabled = false; };
  });
  var dchips = document.querySelectorAll("#dayChips .day-chip");
  for (var c = 0; c < dchips.length; c++) {
    (function (b) {
      b.onclick = function () {
        $("pfDays").value = b.getAttribute("data-d");
        $("btnSaveProfile").disabled = false;
        for (var j = 0; j < dchips.length; j++) dchips[j].classList.toggle("on", dchips[j] === b);
      };
    })(dchips[c]);
  }
  $("btnSaveProfile").onclick = function () {
    S.profile = profileFromForm();
    persist();
    var n = rejudgeAll();
    persist();
    fillProfileForm();
    renderHome();
    $("btnSaveProfile").disabled = true;
    toast("画像已保存" + (n ? "，" + n + " 条记录已重新打标" : ""));
  };
  $("btnExport").onclick = exportData;
  $("btnImport").onclick = function () { $("importFile").click(); };
  $("importFile").onchange = function () {
    if (this.files && this.files[0]) importData(this.files[0]);
    this.value = "";
  };
  $("btnClear").onclick = function () {
    confirmModal("清空所有数据", "将删除画像与全部 <b>" + S.records.length + "</b> 条记录，此操作不可恢复。", "全部删除", false, function () {
      S.records = [];
      S.profile = { name: "", college: "", grade: "大二", major: "", reminderDays: 3 };
      S.openIds = {};
      try { localStorage.removeItem(STORE_KEY); } catch (e) { }
      persist();
      fillProfileForm();
      renderHome();
      renderCal();
      toast("已清空所有数据");
      return true;
    });
  };

  /* Modal */
  $("modalCancel").onclick = closeModal;
  $("modalMask").onclick = function (ev) { if (ev.target === this) closeModal(); };
  $("modalOk").onclick = function () {
    var keep = modalCb ? modalCb() : true;
    if (keep !== false) closeModal();
  };
}

function init() {
  loadStore();
  fillProfileForm();
  bindEvents();
  renderHome();
  renderCal();
}
init();
</script>
